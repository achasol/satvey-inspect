name: satvey-inspect

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: satvey
      POSTGRES_USER: satvey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-satvey-local-db}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U satvey -d satvey']
      interval: 3s
      timeout: 3s
      retries: 30

  rustfs:
    image: rustfs/rustfs:1.0.4
    ports:
      - '127.0.0.1:${RUSTFS_CONSOLE_PORT:-19001}:9001'
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-satvey-local}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-satvey-local-secret-change-me}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
    volumes:
      - object_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/health']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

  migrate:
    build: ./backend
    command: migrate
    environment: &backend-env
      DATABASE_URL: postgres://satvey:${POSTGRES_PASSWORD:-satvey-local-db}@postgres:5432/satvey?sslmode=disable
      APP_URL: ${APP_URL:-http://localhost:5173}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://app:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: satvey-evidence
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-satvey-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-satvey-local-secret-change-me}
      ALLOW_HTTP_OIDC: ${ALLOW_HTTP_OIDC:-true}
      PROPERTY_ENCRYPTION_KEY: ${PROPERTY_ENCRYPTION_KEY:-}
      ALLOW_HTTP_PROPERTY_API: ${ALLOW_HTTP_PROPERTY_API:-false}
      OIDC_PUBLIC_ISSUER: http://localhost:8081/realms/satvey
      OIDC_INTERNAL_BASE_URL: http://keycloak:8080
      PDF_RENDERER_URL: http://pdf:3000
    depends_on:
      postgres:
        condition: service_healthy

  storage-init:
    build: ./backend
    command: storage-init
    environment: *backend-env
    depends_on:
      rustfs:
        condition: service_healthy

  pdf:
    image: gotenberg/gotenberg:8.39.0
    environment:
      TZ: Europe/Amsterdam
      API_TIMEOUT: 120s
      API_BODY_LIMIT: 128MB
      API_DISABLE_DOWNLOAD_FROM: 'true'
      CHROMIUM_AUTO_START: 'true'
      CHROMIUM_MAX_CONCURRENCY: '2'
      CHROMIUM_MAX_QUEUE_SIZE: '8'
      CHROMIUM_ALLOW_LIST: '^file:///tmp/.*'
      CHROMIUM_DENY_PRIVATE_IPS: 'true'
      CHROMIUM_DENY_PUBLIC_IPS: 'true'
      LIBREOFFICE_DISABLE_ROUTES: 'true'
    shm_size: 256mb
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  api:
    build: ./backend
    environment:
      <<: *backend-env
      BASETEN_KEY: ${BASETEN_KEY:-}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-auto}
      BASETEN_MODEL: ${BASETEN_MODEL:-zai-org/GLM-5.3-Flash}
      IMAGE_ANALYSIS_PROVIDER: ${IMAGE_ANALYSIS_PROVIDER:-auto}
      ALLOW_MOCK_ANALYSIS: ${ALLOW_MOCK_ANALYSIS:-true}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      pdf:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8080/api/v1/health']
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    profiles: [sso]
    command: ['start-dev', '--import-realm']
    ports:
      - '127.0.0.1:8081:8080'
    environment:
      KC_HOSTNAME: http://localhost:8081
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-keycloak-change-me}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak-realm.json:/opt/keycloak/data/import/satvey.json:ro

  app:
    image: node:22-alpine
    container_name: satvey-inspect-dev
    working_dir: /app
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_PROXY_TARGET: http://api:8080
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - npm_cache:/root/.npm
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  tests:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    profiles: [test]
    working_dir: /app
    init: true
    ipc: host
    depends_on:
      app:
        condition: service_healthy
    environment:
      PLAYWRIGHT_BASE_URL: http://app:5173
    volumes:
      - .:/app
      - node_modules:/app/node_modules:ro
    command: node tests/run.cjs

  backend-tests:
    profiles: [test]
    build:
      context: ./backend
      target: build
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy
    command: ['go', 'test', '-v', './...']

  pdf-check:
    profiles: [test]
    build:
      context: .
      dockerfile: infra/pdf-check.Dockerfile
    volumes:
      - ./tests/artifacts:/artifacts
      - ./scripts/check-pdf.py:/check-pdf.py:ro
      - ./scripts/check-format-pdf.py:/check-format-pdf.py:ro
      - ./scripts/check-annotations-pdf.py:/check-annotations-pdf.py:ro
    command: ['/artifacts/report-short.pdf', '/artifacts/report-long.pdf', '/artifacts/report-draft.pdf']

  go:
    build:
      context: ./backend
      target: build
    profiles: [tools]
    working_dir: /src
    environment: *backend-env
    volumes:
      - ./backend:/src
      - ./tests/artifacts:/artifacts
      - go_modules:/go/pkg/mod
      - go_cache:/root/.cache/go-build
    depends_on:
      api:
        condition: service_healthy
    command: ['go', 'test', '-v', './...']

volumes:
  postgres_data:
  object_data:
  keycloak_data:
  go_modules:
  go_cache:
  node_modules:
    name: satvey-inspect-node-modules
  npm_cache:
    name: satvey-inspect-npm-cache
