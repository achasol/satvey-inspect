# Use --project-directory . and --env-file .env.production. No development overlay.
name: satvey-production
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '5' }
x-runtime: &runtime
  restart: unless-stopped
  logging: *logging
  security_opt: ['no-new-privileges:true']
x-api-env: &api-env
  APP_ENV: production
  APP_URL: ${APP_URL:?Set HTTPS APP_URL}
  TRUSTED_ORIGINS: ${APP_URL}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.30.0.2/32,172.30.0.3/32}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  S3_ENDPOINT: http://rustfs:9000
  S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY}
  PROPERTY_ENCRYPTION_KEY: ${PROPERTY_ENCRYPTION_KEY:?Set PROPERTY_ENCRYPTION_KEY}
  IMAGE_ANALYSIS_PROVIDER: baseten
  TRANSCRIPTION_PROVIDER: baseten
  BASETEN_KEY: ${BASETEN_KEY:?Set BASETEN_KEY}
  BASETEN_MODEL: ${BASETEN_MODEL:-zai-org/GLM-5.3-Flash}
  ALLOW_MOCK_ANALYSIS: 'false'
  ALLOW_HTTP_OIDC: 'false'
  ALLOW_HTTP_PROPERTY_API: 'false'
  PDF_RENDERER_URL: http://pdf:3000
  SMTP_ADDR: ${SMTP_ADDR:?Set SMTP_ADDR}
  SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
  SMTP_TLS: ${SMTP_TLS:-starttls}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  LEGAL_ENTITY: ${LEGAL_ENTITY:?Set LEGAL_ENTITY}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:?Set SUPPORT_EMAIL}
  PRIVACY_POLICY_URL: ${PRIVACY_POLICY_URL:?Set PRIVACY_POLICY_URL}
  HOSTING_REGION: ${HOSTING_REGION:?Set HOSTING_REGION}
  REPORT_ATTACHMENT_MAX_MB: ${REPORT_ATTACHMENT_MAX_MB:-10}
  INTEGRATION_ALLOWED_HOSTS: ${INTEGRATION_ALLOWED_HOSTS:-}
  INTEGRATION_PRIVATE_HOSTS: ${INTEGRATION_PRIVATE_HOSTS:-}

services:
  edge:
    <<: *runtime
    image: ${CADDY_IMAGE:?Set immutable CADDY_IMAGE}
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports: ['80:80', '443:443']
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: { default: { ipv4_address: '${EDGE_IP:-172.30.0.2}' } }
    mem_limit: 256m
    cpus: 0.5
    depends_on: { web: { condition: service_healthy } }
  web:
    <<: *runtime
    image: ${WEB_IMAGE:?Set immutable WEB_IMAGE}
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    networks: { default: { ipv4_address: '${WEB_IP:-172.30.0.3}' } }
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8080/]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on: { api: { condition: service_healthy } }
  api:
    <<: *runtime
    image: ${API_IMAGE:?Set immutable API_IMAGE}
    environment: *api-env
    read_only: true
    cap_drop: [ALL]
    tmpfs: ['/tmp:uid=10001,gid=10001,mode=0700,size=1g']
    stop_grace_period: 45s
    mem_limit: 4g
    cpus: 3
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8080/api/v1/health/ready]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      rustfs: { condition: service_healthy }
      pdf: { condition: service_healthy }
  migrate:
    image: ${API_IMAGE}
    environment: *api-env
    command: migrate
    profiles: [tools]
    depends_on: { postgres: { condition: service_healthy } }
  storage-init:
    image: ${API_IMAGE}
    environment: *api-env
    command: storage-init
    profiles: [tools]
    depends_on: { rustfs: { condition: service_healthy } }
  postgres:
    <<: *runtime
    image: ${POSTGRES_IMAGE:?Set immutable POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: satvey
      POSTGRES_USER: satvey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql]
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test: [CMD-SHELL, pg_isready -U satvey -d satvey]
      interval: 5s
      timeout: 3s
      retries: 30
  rustfs:
    <<: *runtime
    image: ${RUSTFS_IMAGE:?Set immutable RUSTFS_IMAGE}
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: 'false'
    volumes: [object_data:/data]
    mem_limit: 2g
    cpus: 1
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/health]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  pdf:
    <<: *runtime
    image: ${PDF_IMAGE:?Set immutable PDF_IMAGE}
    environment:
      API_TIMEOUT: 120s
      API_BODY_LIMIT: 128MB
      API_DISABLE_DOWNLOAD_FROM: 'true'
      CHROMIUM_AUTO_START: 'true'
      CHROMIUM_MAX_CONCURRENCY: '2'
      CHROMIUM_MAX_QUEUE_SIZE: '8'
      CHROMIUM_ALLOW_LIST: '^file:///tmp/.*'
      CHROMIUM_DENY_PRIVATE_IPS: 'true'
      CHROMIUM_DENY_PUBLIC_IPS: 'true'
      LIBREOFFICE_DISABLE_ROUTES: 'true'
    shm_size: 256mb
    cap_drop: [ALL]
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test: [CMD, curl, -f, http://localhost:3000/health]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

networks:
  default:
    ipam: { config: [{ subnet: '${NETWORK_SUBNET:-172.30.0.0/24}' }] }
volumes:
  postgres_data:
  object_data:
  caddy_data:
  caddy_config:
