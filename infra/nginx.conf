log_format satvey '$time_iso8601 $request_id $upstream_http_x_request_id $request_method $status $request_time';
server {
  listen 8080;
  server_name _;
  access_log /dev/stdout satvey;
  # Nginx error entries include raw URIs; API logs and health metrics provide safe diagnostics.
  error_log /dev/stderr crit;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 50m;
  include /etc/nginx/satvey-security.conf;
  location /api/ {
    proxy_pass http://api:8080;
    proxy_request_buffering off;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    include /etc/nginx/satvey-security.conf;
    add_header Cache-Control no-store always;
  }
  location / { include /etc/nginx/satvey-security.conf; try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
  location /assets/ { include /etc/nginx/satvey-security.conf; try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
  location = /internal/metrics { return 404; }
}
