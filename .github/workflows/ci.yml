name: Verify
on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: '22', cache: npm }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            tools/vera-receiver/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          {
            python-version: '3.13',
            cache: pip,
            cache-dependency-path: benchmarks/property-state/requirements.txt,
          }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Validate Linux operations scripts
        run: docker run --rm -v "$PWD:/work:ro" -w /work koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d scripts/backup.sh scripts/restore.sh scripts/deploy.sh
      - run: npm audit --audit-level=high
      - run: test -z "$(gofmt -l .)" && go vet ./...
        working-directory: apps/api
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        working-directory: apps/api
      - run: test -z "$(gofmt -l .)" && go vet ./...
        working-directory: tools/vera-receiver
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        working-directory: tools/vera-receiver
      - run: python scripts/openapi.py && git diff --exit-code -- docs/openapi.json
      - run: pip install -r benchmarks/property-state/requirements.txt
      - run: python -m unittest -v test_benchmark
        working-directory: benchmarks/property-state
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: frontend-coverage, path: apps/web/coverage, retention-days: 14 }
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SATVEY_TEST_PROFILE: ci
      TEST_BROWSER_ARGS: --project=chromium --workers=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: '22' }
      - name: Select full browser matrix for nightly and release verification
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: echo 'TEST_BROWSER_ARGS=--workers=1' >> "$GITHUB_ENV"
      - run: node scripts/test-stack.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-artifacts
          path: |
            tests/artifacts
            test-results
            playwright-report
          retention-days: 14
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -t satvey-web:verify . && docker build -t satvey-api:verify apps/api
      - name: Validate production web configuration
        run: docker run --rm --add-host api:127.0.0.1 satvey-web:verify nginx -t
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          {
            image-ref: 'satvey-web:verify',
            exit-code: '1',
            severity: 'HIGH,CRITICAL',
            ignore-unfixed: true,
          }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          {
            image-ref: 'satvey-api:verify',
            exit-code: '1',
            severity: 'HIGH,CRITICAL',
            ignore-unfixed: true,
          }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with: { scan-type: fs, scanners: secret, exit-code: '1' }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with: { image-ref: 'satvey-api:verify', format: cyclonedx, output: api.sbom.json }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with: { image-ref: 'satvey-web:verify', format: cyclonedx, output: web.sbom.json }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: image-sboms, path: '*.sbom.json', retention-days: 30 }
