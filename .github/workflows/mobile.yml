name: Native build verification
on:
  pull_request:
    paths:
      [
        'apps/web/**',
        'package-lock.json',
        'scripts/build-mobile.mjs',
        '.github/workflows/mobile.yml',
      ]
  workflow_dispatch:
    inputs:
      api_origin:
        description: HTTPS API origin for the verification binary
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
env:
  VITE_API_URL: ${{ inputs.api_origin || 'https://inspect.invalid' }}
  MOBILE_VERIFY_ONLY: '1'
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: '22', cache: npm }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
      - run: node scripts/build-mobile.mjs
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - run: bash ./gradlew assembleDebug bundleRelease --no-daemon
        working-directory: apps/web/android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-unsigned-verification
          path: |
            apps/web/android/app/build/outputs/apk/debug/*.apk
            apps/web/android/app/build/outputs/bundle/release/*.aab
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: node scripts/build-mobile.mjs
      - run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/web/ios/App
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-simulator-verification
          path: apps/web/ios/App/build/Build/Products/Debug-iphonesimulator/App.app
